<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">Máquina de Shorts</title>
<desc id="d">Tema, roteiro, checagem de fatos, imagens com licença, voz local, legendas, vídeo e publicação, sem revisão humana e com custo de API de R$ 0.</desc>
<style>
text{font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}

.hl{opacity:0;animation:lit 9s ease-in-out infinite}
@keyframes lit{0%{opacity:0}3%{opacity:1}12%{opacity:1}20%{opacity:0}100%{opacity:0}}
.dot{opacity:0;animation:hop 9s linear infinite}
@keyframes hop{0%{opacity:0;transform:translateX(0)}1%{opacity:1}7%{opacity:1;transform:translateX(12px)}8%{opacity:0;transform:translateX(12px)}100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:left center;animation:fill 9s ease-in-out infinite}
@keyframes fill{0%{transform:scaleX(0.02)}85%{transform:scaleX(1)}95%{transform:scaleX(1)}100%{transform:scaleX(0.02)}}
.seal{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#17142b"/></linearGradient>
<radialGradient id="glowA" cx="0.88" cy="0" r="0.7"><stop offset="0" stop-color="#ef4444" stop-opacity="0.20"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx="0.08" cy="1" r="0.6"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.20"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2540"/><stop offset="1" stop-color="#161d2e"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
</defs>
<rect width="1200" height="330" rx="20" fill="url(#bg)"/>
<rect width="1200" height="330" rx="20" fill="url(#glowA)"/>
